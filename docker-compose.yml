secrets:
  api_env:
    file: devops/api/.env.production
  redis_env:
    file: .env.redis
  postgres_password:
    file: devops/postgres/.password
  postgres_user:
    file: devops/postgres/.user

services:
  api:
    build:
      dockerfile: Dockerfile
      context: api/
    secrets:
      - api_env
    environment:
      DJANGO_ENV_FILE: /run/secrets/api_env
    volumes:
      - media_data:/app/src/etherbeing/media
    ports:
      - 127.0.0.1:7000:8000
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
  redis:
    # 6379
    image: redis:latest
    secrets:
      - redis_env
    volumes:
      - redis_data:/data
    restart: unless-stopped
  postgres:
    image: postgres:latest
    secrets:
      - postgres_user
      - postgres_password
    environment:
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_USER_FILE=/run/secrets/postgres_user
      - POSTGRES_DB=etherbeing_db
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/
    restart: unless-stopped
volumes:
  postgres_data:
  media_data:
  redis_data:

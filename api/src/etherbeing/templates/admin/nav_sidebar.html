{% load i18n %}
<button class="sticky toggle-nav-sidebar" id="toggle-nav-sidebar" aria-label="{% translate 'Toggle navigation' %}"></button>
<nav class="sticky etherbeing-admin-nav-shell" id="nav-sidebar" aria-label="{% translate 'Sidebar' %}">
  <div class="etherbeing-admin-nav-quick-actions">
    <a href="{% url 'admin:publish-blog-post' %}" class="button default">{% translate "Publish post" %}</a>
  </div>
  <div class="etherbeing-admin-nav-search">
    <input
      type="search"
      id="nav-filter"
      placeholder="{% translate 'Start typing to filter…' %}"
      aria-label="{% translate 'Filter navigation items' %}"
    >
  </div>
  {% include 'admin/app_list.html' with app_list=available_apps show_changelinks=False %}
</nav>
